<h2 id="contact-title">Vamos construir algo<br /><em>que realmente importa?</em></h2>

<form class="contact-form" (submit)="sendMessage($event)">
  <input type="hidden" name="_subject" value="contato" />
  <input type="hidden" name="_template" value="table" />

  <label for="contact-email">e-mail</label>
  <input
    id="contact-email"
    name="email"
    type="email"
    autocomplete="email"
    placeholder="voce@exemplo.com"
    required
  />

  <div class="message-heading">
    <label for="contact-message">mensagem</label>
    <span>{{ messageLength() }} / 2000</span>
  </div>
  <textarea
    id="contact-message"
    name="message"
    rows="3"
    maxlength="2000"
    placeholder="Conte um pouco sobre sua ideia, projeto ou oportunidade..."
    required
    (input)="updateMessageLength($event)"
  ></textarea>

  <button type="submit" [disabled]="sendState() === 'sending'">
    {{ sendState() === 'sending' ? 'Enviando…' : 'Enviar mensagem' }}
  </button>

  <p class="form-status" aria-live="polite">
    @if (sendState() === 'success') {
      Mensagem enviada. Obrigado pelo contato!
    } @else if (sendState() === 'error') {
      Não foi possível enviar agora. Tente novamente em instantes.
    }
  </p>
</form>
